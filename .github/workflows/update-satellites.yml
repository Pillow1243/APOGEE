name: Refresh satellite catalog
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sat-catalog
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Celestrak GP
        run: python3 scripts/update_satellites.py
      - name: Commit if changed
        run: |
          git config user.name "APOGEE bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/satellites.json
          if git diff --cached --quiet; then
            echo "catalog unchanged"
          else
            git commit -m "chore: refresh satellite catalog"
            git push
          fi
